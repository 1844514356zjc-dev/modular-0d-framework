name: Scientific validation and deployment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements/docker.txt
            requirements/validation-constraints.txt
      - name: Install all test, UI, and benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements/validation-constraints.txt -e '.[dev,ui]'
          python -m pip check
      - name: Check PEP 8 with Flake8
        run: python -m flake8 src tests examples --count --show-source --statistics
      - name: Run thermodynamics and dashboard tests
        run: python -m pytest -ra --strict-config --strict-markers --junitxml=junit.xml
      - name: Verify modular composition examples
        run: PYTHONPATH=src python examples/solve_modular.py

  docker:
    name: Container build and smoke test
    needs: python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start healthy service
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Check HTTP readiness
        run: curl --fail --silent --show-error http://127.0.0.1:8501/_stcore/health
      - name: Exercise engine and scavenging calculation inside the container
        run: |
          docker compose exec -T modular-0d-framework python - <<'PYCODE'
          from ui.engine_dashboard import EngineSettings, simulate
          for settings in (
              EngineSettings(),
              EngineSettings(topology="four_stroke", compression_ratio=10),
              EngineSettings(topology="closed"),
          ):
              result = simulate(settings)
              assert len(result["frame"]) == 1441
              assert result["eos_error"] < 2e-6
              assert result["energy_error"] < 2e-6
              if settings.topology != "closed":
                  assert 0 < result["metrics"]["eta_tr"] <= 1
                  assert 0 < result["metrics"]["eta_sc"] <= 1
              print(settings.topology, result["work_J"])
          PYCODE
      - name: Show service logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop service
        if: always()
        run: docker compose down --remove-orphans
